<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translation Review - Surebet Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --border-color: #475569;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 20px 0;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 .icon {
      font-size: 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
    }

    .stat-card .value.pending { color: var(--accent-warning); }
    .stat-card .value.approved { color: var(--accent-success); }
    .stat-card .value.rejected { color: var(--accent-danger); }
    .stat-card .value.total { color: var(--accent-primary); }

    .filters {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      min-width: 150px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .btn {
      background: var(--accent-primary);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-success {
      background: var(--accent-success);
    }

    .btn-danger {
      background: var(--accent-danger);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
    }

    .actions-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions-bar .left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      min-width: auto;
    }

    .translations-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .translation-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }

    .translation-card:hover {
      border-color: var(--accent-primary);
    }

    .translation-card.selected {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.1);
    }

    .translation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .translation-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-namespace {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .badge-language {
      background: var(--accent-primary);
      color: white;
    }

    .badge-provider {
      background: var(--accent-warning);
      color: var(--bg-primary);
    }

    .translation-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 16px;
    }

    .text-block {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 16px;
    }

    .text-block label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .text-block .text {
      font-size: 16px;
      line-height: 1.5;
    }

    .text-block .text.original {
      color: var(--text-secondary);
    }

    .text-block .text.translated {
      color: var(--text-primary);
    }

    .translation-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: var(--accent-success);
    }

    .toast.error {
      border-color: var(--accent-danger);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-secondary);
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow: hidden;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .provider-status {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .provider-card {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .provider-card .status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .provider-card .status.active {
      background: var(--accent-success);
    }

    .provider-card .status.inactive {
      background: var(--accent-danger);
    }

    @media (max-width: 768px) {
      .translation-content {
        grid-template-columns: 1fr;
      }
      
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filter-group {
        width: 100%;
      }
      
      select, input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>
        <span class="icon">🤖</span>
        AI Translation Review
      </h1>
    </div>
  </header>

  <div class="container">
    <!-- Provider Status -->
    <div class="provider-status" id="providerStatus">
      <div class="loading"><span class="spinner"></span>Checking providers...</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <h3>Pending Review</h3>
        <div class="value pending" id="pendingCount">-</div>
      </div>
      <div class="stat-card">
        <h3>Approved</h3>
        <div class="value approved" id="approvedCount">-</div>
      </div>
      <div class="stat-card">
        <h3>Rejected</h3>
        <div class="value rejected" id="rejectedCount">-</div>
      </div>
      <div class="stat-card">
        <h3>Total AI Translated</h3>
        <div class="value total" id="totalCount">-</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <label>Language</label>
        <select id="languageFilter">
          <option value="">All Languages</option>
          <option value="fr">🇫🇷 French</option>
          <option value="es">🇪🇸 Spanish</option>
          <option value="de">🇩🇪 German</option>
          <option value="it">🇮🇹 Italian</option>
          <option value="pt">🇵🇹 Portuguese</option>
          <option value="nl">🇳🇱 Dutch</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Namespace</label>
        <select id="namespaceFilter">
          <option value="">All Namespaces</option>
          <option value="common">Common</option>
          <option value="auth">Auth</option>
          <option value="dashboard">Dashboard</option>
          <option value="opportunities">Opportunities</option>
          <option value="betting">Betting</option>
          <option value="bookmakers">Bookmakers</option>
          <option value="notifications">Notifications</option>
        </select>
      </div>
      <button class="btn" onclick="loadTranslations()">🔄 Refresh</button>
      <button class="btn btn-secondary" onclick="showAutoTranslateModal()">⚡ Auto-Translate</button>
    </div>

    <!-- Actions Bar -->
    <div class="actions-bar">
      <div class="left">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
          <span>Select All</span>
        </label>
        <span id="selectedCount" style="color: var(--text-secondary);"></span>
      </div>
      <div>
        <button class="btn btn-success" onclick="bulkApprove()" id="bulkApproveBtn" disabled>✓ Approve Selected</button>
        <button class="btn btn-danger" onclick="bulkReject()" id="bulkRejectBtn" disabled>✗ Reject Selected</button>
      </div>
    </div>

    <!-- Translations List -->
    <div class="translations-list" id="translationsList">
      <div class="loading"><span class="spinner"></span>Loading translations...</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toastMessage"></span>
  </div>

  <!-- Auto-Translate Modal -->
  <div class="modal-overlay" id="autoTranslateModal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚡ Auto-Translate Missing Keys</h3>
      </div>
      <div class="modal-body">
        <div class="filter-group" style="margin-bottom: 16px;">
          <label>Target Language</label>
          <select id="autoTranslateLang">
            <option value="fr">🇫🇷 French</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="de">🇩🇪 German</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="pt">🇵🇹 Portuguese</option>
            <option value="nl">🇳🇱 Dutch</option>
          </select>
        </div>
        <div class="filter-group" style="margin-bottom: 16px;">
          <label>Namespace (optional)</label>
          <select id="autoTranslateNamespace">
            <option value="">All Namespaces</option>
            <option value="common">Common</option>
            <option value="auth">Auth</option>
            <option value="dashboard">Dashboard</option>
            <option value="opportunities">Opportunities</option>
            <option value="betting">Betting</option>
          </select>
        </div>
        <label class="checkbox-wrapper" style="margin-bottom: 16px;">
          <input type="checkbox" id="dryRun" checked>
          <span>Dry run (preview only, don't save)</span>
        </label>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="reviewRequired" checked>
          <span>Mark for human review</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="hideAutoTranslateModal()">Cancel</button>
        <button class="btn" onclick="runAutoTranslate()">Start Translation</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/ai-translate';
    let translations = [];
    let selectedIds = new Set();
    let qualityStats = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadProviderStatus();
      loadQualityStats();
      loadTranslations();
    });

    // Load provider status
    async function loadProviderStatus() {
      try {
        const response = await fetch(`${API_BASE}/providers`);
        const data = await response.json();
        
        const html = data.providers.map(p => `
          <div class="provider-card">
            <div class="status ${p.available ? 'active' : 'inactive'}"></div>
            <span>${p.name === 'deepl' ? 'DeepL' : 'Google Translate'} ${p.available ? '✓' : '✗'}</span>
          </div>
        `).join('');
        
        document.getElementById('providerStatus').innerHTML = html;
      } catch (error) {
        showToast('Failed to load provider status', 'error');
      }
    }

    // Load quality stats
    async function loadQualityStats() {
      try {
        const response = await fetch(`${API_BASE}/stats/quality`);
        const data = await response.json();
        qualityStats = data.statistics;
        
        // Calculate totals
        let pending = 0, approved = 0, rejected = 0, total = 0;
        
        qualityStats.forEach(s => {
          pending += s.pendingReview || 0;
          approved += s.approved || 0;
          rejected += s.rejected || 0;
          total += s.autoTranslated || 0;
        });
        
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('approvedCount').textContent = approved;
        document.getElementById('rejectedCount').textContent = rejected;
        document.getElementById('totalCount').textContent = total;
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    // Load pending translations
    async function loadTranslations() {
      const language = document.getElementById('languageFilter').value;
      const namespace = document.getElementById('namespaceFilter').value;
      
      try {
        const url = new URL(`${API_BASE}/pending-review`, window.location.origin);
        if (language) url.searchParams.append('language', language);
        if (namespace) url.searchParams.append('namespace', namespace);
        url.searchParams.append('limit', '100');
        
        const response = await fetch(url);
        const data = await response.json();
        translations = data.translations;
        
        renderTranslations();
      } catch (error) {
        showToast('Failed to load translations', 'error');
      }
    }

    // Render translations list
    function renderTranslations() {
      const container = document.getElementById('translationsList');
      
      if (translations.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">✅</div>
            <h3>All Caught Up!</h3>
            <p>No translations pending review.</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = translations.map(t => `
        <div class="translation-card ${selectedIds.has(t.id) ? 'selected' : ''}" data-id="${t.id}">
          <div class="translation-header">
            <div class="translation-meta">
              <input type="checkbox" ${selectedIds.has(t.id) ? 'checked' : ''} 
                     onchange="toggleSelection('${t.id}')">
              <span class="badge badge-namespace">${t.namespace}</span>
              <span class="badge badge-language">${t.language.toUpperCase()}</span>
              <span class="badge badge-provider">${t.provider || 'AI'}</span>
              <span style="color: var(--text-secondary); font-size: 12px;">${t.key}</span>
            </div>
            <span style="color: var(--text-secondary); font-size: 12px;">
              ${new Date(t.translatedAt).toLocaleString()}
            </span>
          </div>
          <div class="translation-content">
            <div class="text-block">
              <label>📝 Original (English)</label>
              <div class="text original">${escapeHtml(t.originalText || '')}</div>
            </div>
            <div class="text-block">
              <label>🤖 AI Translation</label>
              <div class="text translated">${escapeHtml(t.value)}</div>
            </div>
          </div>
          <div class="translation-actions">
            <button class="btn btn-success" onclick="approveTranslation('${t.id}')">✓ Approve</button>
            <button class="btn btn-danger" onclick="rejectTranslation('${t.id}')">✗ Reject</button>
            <button class="btn btn-secondary" onclick="suggestImprovement('${t.id}')">💡 Suggest</button>
          </div>
        </div>
      `).join('');
    }

    // Toggle selection
    function toggleSelection(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateSelectionUI();
    }

    // Toggle select all
    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAll').checked;
      if (selectAll) {
        translations.forEach(t => selectedIds.add(t.id));
      } else {
        selectedIds.clear();
      }
      updateSelectionUI();
      renderTranslations();
    }

    // Update selection UI
    function updateSelectionUI() {
      const count = selectedIds.size;
      document.getElementById('selectedCount').textContent = count > 0 ? `(${count} selected)` : '';
      document.getElementById('bulkApproveBtn').disabled = count === 0;
      document.getElementById('bulkRejectBtn').disabled = count === 0;
    }

    // Approve translation
    async function approveTranslation(id) {
      try {
        const response = await fetch(`${API_BASE}/review/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'approve',
            reviewerId: 'admin'
          })
        });
        
        if (response.ok) {
          showToast('Translation approved', 'success');
          selectedIds.delete(id);
          loadTranslations();
          loadQualityStats();
        } else {
          throw new Error('Failed to approve');
        }
      } catch (error) {
        showToast('Failed to approve translation', 'error');
      }
    }

    // Reject translation
    async function rejectTranslation(id) {
      try {
        const response = await fetch(`${API_BASE}/review/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'reject',
            reviewerId: 'admin'
          })
        });
        
        if (response.ok) {
          showToast('Translation rejected', 'success');
          selectedIds.delete(id);
          loadTranslations();
          loadQualityStats();
        } else {
          throw new Error('Failed to reject');
        }
      } catch (error) {
        showToast('Failed to reject translation', 'error');
      }
    }

    // Bulk approve
    async function bulkApprove() {
      if (selectedIds.size === 0) return;
      
      try {
        const response = await fetch(`${API_BASE}/bulk-review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            translationIds: Array.from(selectedIds),
            action: 'approve',
            reviewerId: 'admin'
          })
        });
        
        if (response.ok) {
          showToast(`${selectedIds.size} translations approved`, 'success');
          selectedIds.clear();
          document.getElementById('selectAll').checked = false;
          updateSelectionUI();
          loadTranslations();
          loadQualityStats();
        }
      } catch (error) {
        showToast('Failed to bulk approve', 'error');
      }
    }

    // Bulk reject
    async function bulkReject() {
      if (selectedIds.size === 0) return;
      
      try {
        const response = await fetch(`${API_BASE}/bulk-review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            translationIds: Array.from(selectedIds),
            action: 'reject',
            reviewerId: 'admin'
          })
        });
        
        if (response.ok) {
          showToast(`${selectedIds.size} translations rejected`, 'success');
          selectedIds.clear();
          document.getElementById('selectAll').checked = false;
          updateSelectionUI();
          loadTranslations();
          loadQualityStats();
        }
      } catch (error) {
        showToast('Failed to bulk reject', 'error');
      }
    }

    // Suggest improvement
    async function suggestImprovement(id) {
      try {
        const response = await fetch(`${API_BASE}/suggest/${id}`);
        const data = await response.json();
        
        if (data.success) {
          alert(`Current: ${data.current}\n\nSuggested: ${data.suggested}\n\nProvider: ${data.provider}`);
        }
      } catch (error) {
        showToast('Failed to get suggestion', 'error');
      }
    }

    // Auto-translate modal
    function showAutoTranslateModal() {
      document.getElementById('autoTranslateModal').classList.add('show');
    }

    function hideAutoTranslateModal() {
      document.getElementById('autoTranslateModal').classList.remove('show');
    }

    // Run auto-translate
    async function runAutoTranslate() {
      const targetLang = document.getElementById('autoTranslateLang').value;
      const namespace = document.getElementById('autoTranslateNamespace').value;
      const dryRun = document.getElementById('dryRun').checked;
      const reviewRequired = document.getElementById('reviewRequired').checked;
      
      hideAutoTranslateModal();
      showToast('Starting auto-translation...', 'success');
      
      try {
        const response = await fetch(`${API_BASE}/auto-translate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            targetLang,
            namespace: namespace || null,
            dryRun,
            reviewRequired
          })
        });
        
        const data = await response.json();
        
        if (dryRun) {
          showToast(`Dry run: ${data.translated} keys would be translated`, 'success');
        } else {
          showToast(`Translated ${data.translated} keys (${data.failed} failed)`, 'success');
          loadTranslations();
          loadQualityStats();
        }
      } catch (error) {
        showToast('Auto-translation failed', 'error');
      }
    }

    // Show toast notification
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      
      toast.className = `toast ${type}`;
      toastMessage.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal on overlay click
    document.getElementById('autoTranslateModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        hideAutoTranslateModal();
      }
    });
  </script>
</body>
</html>
