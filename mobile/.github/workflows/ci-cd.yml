name: Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # Code Quality Checks
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint --if-present || echo "No lint script"
    
    - name: Run TypeScript check
      run: npm run typecheck --if-present || echo "No typecheck script"
    
    - name: Run unit tests
      run: npm test -- --coverage --coverageDirectory=./coverage
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        directory: ./mobile/coverage
        flags: mobile

  # iOS Build
  build-ios:
    runs-on: macos-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ./mobile/ios
    
    - name: Install CocoaPods
      run: |
        cd ios
        bundle install
        pod install
        cd ..
    
    - name: Setup provisioning profiles
      env:
        IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        # Create keychain
        security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -l build.keychain
        
        # Import certificate
        echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain
        
        # Install provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
    
    - name: Build iOS app
      run: |
        xcodebuild -workspace ios/SurebetMobile.xcworkspace \
          -scheme SurebetMobile \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/SurebetMobile.xcarchive \
          PROVISIONING_PROFILE_SPECIFIER='match AppStore com.surebet.mobile' \
          CODE_SIGN_IDENTITY='iPhone Distribution' \
          archive
    
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/SurebetMobile.xcarchive \
          -exportOptionsPlist ios/ExportOptions.plist \
          -exportPath build/output
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: ./mobile/build/output/*.ipa
        retention-days: 30

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm ci
    
    - name: Decode keystore
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      run: |
        echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/surebet.keystore
    
    - name: Build Android app
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=surebet.keystore \
          -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: ./mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-bundle
        path: ./mobile/android/app/build/outputs/bundle/release/*.aab
        retention-days: 30

  # E2E Tests
  e2e-tests:
    runs-on: macos-latest
    needs: [lint-and-test]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Install Detox
      run: |
        brew tap wix/brew
        brew install applesimutils
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Pods
      run: |
        cd ios
        pod install
        cd ..
    
    - name: Build for E2E
      run: detox build --configuration ios.release
    
    - name: Run E2E tests
      run: detox test --configuration ios.release --headless --artifacts-location ./artifacts
    
    - name: Upload E2E artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: ./mobile/artifacts

  # Deploy to TestFlight
  deploy-ios-testflight:
    runs-on: macos-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download IPA
      uses: actions/download-artifact@v4
      with:
        name: ios-app
        path: ./mobile/build/output
    
    - name: Upload to TestFlight
      env:
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      run: |
        echo "$APPLE_API_KEY" | base64 --decode > AuthKey.p8
        
        xcrun altool --upload-app \
          -f build/output/*.ipa \
          -t ios \
          --apiKey $APPLE_API_KEY_ID \
          --apiIssuer $APPLE_API_ISSUER_ID

  # Deploy to Google Play Internal
  deploy-android-internal:
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download AAB
      uses: actions/download-artifact@v4
      with:
        name: android-bundle
        path: ./mobile/build
    
    - name: Upload to Google Play
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: com.surebet.mobile
        releaseFiles: ./mobile/build/*.aab
        track: internal
        status: completed

  # Create GitHub Release
  create-release:
    runs-on: ubuntu-latest
    needs: [deploy-ios-testflight, deploy-android-internal]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    
    - name: Download iOS artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-app
        path: ./artifacts/ios
    
    - name: Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: android-app
        path: ./artifacts/android
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/ios/*.ipa
          ./artifacts/android/*.apk
        generate_release_notes: true
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}