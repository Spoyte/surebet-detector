name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  ios-e2e:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup Detox
      run: |
        brew tap wix/brew
        brew install applesimutils
    
    - name: Install Pods
      run: |
        cd ios
        pod install
        cd ..
    
    - name: Build iOS app for testing
      run: detox build --configuration ios.release
    
    - name: Run iOS E2E tests
      run: detox test --configuration ios.release --headless --artifacts-location ./artifacts/ios
    
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ios-artifacts
        path: ./mobile/artifacts/ios

  android-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./mobile/package-lock.json
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Android app for testing
      run: detox build --configuration android.release
    
    - name: Run Android E2E tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_7
        working-directory: ./mobile
        script: detox test --configuration android.release --headless --artifacts-location ./artifacts/android
    
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-artifacts
        path: ./mobile/artifacts/android