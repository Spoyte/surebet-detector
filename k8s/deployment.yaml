# Surebet Detector - Kubernetes Deployment

apiVersion: v1
kind: Namespace
metadata:
  name: surebet
  labels:
    name: surebet
    app.kubernetes.io/name: surebet-detector
    app.kubernetes.io/version: "2.0.0"

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: surebet-config
  namespace: surebet
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  REDIS_URL: "redis://redis:6379"
  SPORTS: "soccer,tennis,basketball,esports"
  MARKETS: "h2h,spreads,totals"
  MIN_EV_THRESHOLD: "5"
  UPDATE_CRON: "0 * * * *"

---
# Secret for API keys
apiVersion: v1
kind: Secret
metadata:
  name: surebet-secrets
  namespace: surebet
type: Opaque
stringData:
  ODDS_API_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  # Add other API keys as needed

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: surebet
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: surebet
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# Surebet Detector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surebet-detector
  namespace: surebet
  labels:
    app: surebet-detector
    version: v2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: surebet-detector
  template:
    metadata:
      labels:
        app: surebet-detector
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: surebet-detector
          image: surebet-detector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: surebet-config
            - secretRef:
                name: surebet-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}

---
# Surebet Detector Service
apiVersion: v1
kind: Service
metadata:
  name: surebet-detector
  namespace: surebet
  labels:
    app: surebet-detector
spec:
  type: ClusterIP
  selector:
    app: surebet-detector
  ports:
    - port: 3000
      targetPort: 3000
      name: http

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: surebet-detector-hpa
  namespace: surebet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: surebet-detector
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: surebet-ingress
  namespace: surebet
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.surebet-detector.com
      secretName: surebet-tls
  rules:
    - host: api.surebet-detector.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: surebet-detector
                port:
                  number: 3000

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: surebet-pdb
  namespace: surebet
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: surebet-detector

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: surebet-network-policy
  namespace: surebet
spec:
  podSelector:
    matchLabels:
      app: surebet-detector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: surebet-sa
  namespace: surebet

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: surebet-role
  namespace: surebet
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

---
# Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: surebet-rolebinding
  namespace: surebet
subjects:
  - kind: ServiceAccount
    name: surebet-sa
    namespace: surebet
roleRef:
  kind: Role
  name: surebet-role
  apiGroup: rbac.authorization.k8s.io
